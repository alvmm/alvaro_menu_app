name: Build Native Android APK (Menú AyA)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile_app
        run: npm install --legacy-peer-deps

      - name: Generate native Android project (Expo Prebuild)
        working-directory: mobile_app
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK with Gradle
        working-directory: mobile_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../Menu-AyA.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Menu-AyA-Android-APK
          path: Menu-AyA.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-mobile
          name: "📱 Menú AyA v2.0 — App Nativa Android (.apk)"
          body: "Instalador nativo de Android (`.apk`) conectado 24/7 al servidor en la nube (`https://alvaro-menu-app.onrender.com`). No requiere tener el ordenador encendido."
          files: Menu-AyA.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
